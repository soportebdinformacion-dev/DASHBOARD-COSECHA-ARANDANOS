<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agrícola Huarmey - Gestión de Cosecha de Arándanos</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            agriRed: {
              light: '#FFEBEE',
              DEFAULT: '#E53935',
              dark: '#C62828',
            },
            agriGreen: {
              light: '#E8F5E9',
              DEFAULT: '#388E3C',
              dark: '#1B5E20',
            },
            agriBg: '#F7F9F7',
          }
        }
      }
    }
  </script>

  <!-- React 18 & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background-color: #F4F7F4;
    }

    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #f1f1f1;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #c1c1c1;
      border-radius: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: #a8a8a8;
    }

    /* PWA install prompt button pulse animation */
    @keyframes subtlePulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.03); }
    }
    .pulse-btn {
      animation: subtlePulse 3s infinite ease-in-out;
    }
  </style>
</head>
<body class="bg-agriBg text-gray-800 min-h-screen antialiased flex flex-col">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // API Endpoint provided by user
    const API_URL = "https://script.google.com/macros/s/AKfycbwn-ZFmIzE2TGPuGWMUAe5aHfVEBkyGURmq3YG05oe6bhdRfike3bdwGCVZPVwRDeov/exec";

    // Utility formatting functions as mandated by rules
    const formatNumber = (val) => {
      if (val === null || val === undefined || isNaN(val)) return '0';
      return Math.round(Number(val)).toLocaleString('es-PE');
    };

    const formatPercent = (val) => {
      if (val === null || val === undefined || isNaN(val)) return '0%';
      return Math.round(Number(val)) + '%';
    };

    const formatDateStr = (dateVal) => {
      if (!dateVal) return '';
      if (typeof dateVal === 'string' && dateVal.includes('/')) {
        const parts = dateVal.split('/');
        if (parts.length === 3) {
          const day = parts[0].padStart(2, '0');
          const month = parts[1].padStart(2, '0');
          const year = parts[2].length === 2 ? '20' + parts[2] : parts[2];
          return `${day}/${month}/${year}`;
        }
      }
      try {
        const d = new Date(dateVal);
        if (isNaN(d.getTime())) return dateVal;
        const day = String(d.getDate()).padStart(2, '0');
        const month = String(d.getMonth() + 1).padStart(2, '0');
        const year = d.getFullYear();
        return `${day}/${month}/${year}`;
      } catch (e) {
        return dateVal;
      }
    };

    // Compliance color badge generator based on CUMP %
    const getComplianceBadge = (cump) => {
      const val = parseFloat(cump) || 0;
      if (val < 86) {
        return <span class="bg-red-100 text-red-800 text-xs font-semibold px-2.5 py-0.5 rounded-full border border-red-300">MALO ({Math.round(val)}%)</span>;
      } else if (val < 100) {
        return <span class="bg-orange-100 text-orange-800 text-xs font-semibold px-2.5 py-0.5 rounded-full border border-orange-300">REGULAR ({Math.round(val)}%)</span>;
      } else if (val <= 104) {
        return <span class="bg-green-100 text-green-800 text-xs font-semibold px-2.5 py-0.5 rounded-full border border-green-300">BUENO ({Math.round(val)}%)</span>;
      } else {
        return <span class="bg-blue-100 text-blue-800 text-xs font-semibold px-2.5 py-0.5 rounded-full border border-blue-300">EXCELENTE ({Math.round(val)}%)</span>;
      }
    };

    const GENERATE_MOCK_DATA = () => {
      const dates = ["01/08/2026", "02/08/2026", "03/08/2026", "04/08/2026", "05/08/2026", "06/08/2026"];
      const modalidades = ["CAMPAMENTO", "IDA Y VUELTA"];
      const categorias = ["SUPREME", "PREMIUM", "ESTÁNDAR"];
      const rangos = ["80-90%", "90-100%", "100-110%", "110%+"];
      const variedades = ["VENTURA", "ROCIO", "BILOXI"];
      const placas = ["T1A-890", "A5F-432", "B9K-112", "C7X-901"];
      const transportistas = ["Trans. Huarmey SAC", "Express del Norte", "Logística Agro S.A."];
      const origenes = ["Fundo 1", "Fundo 2", "Sector Norte"];
      const sexos = ["M", "F"];

      const harvesters = [
        { dni: "72849102", name: "ALVAREZ MENDOZA, JOSE JUAN" },
        { dni: "71928301", name: "BENITEZ CASTILLO, MARIA LUZ" },
        { dni: "70392817", name: "CORTEZ RUIZ, CARLOS ALBERTO" },
        { dni: "74910283", name: "DIAZ FLORES, ROSA ISABEL" },
        { dni: "73820192", name: "ESPINOSA FIGUEROA, LUIS" },
        { dni: "75920183", name: "FLORES GUTIERREZ, ANA" },
        { dni: "71029384", name: "GARCIA NAVARRO, JORGE" },
        { dni: "76930192", name: "HERRERA SOLIS, PATRICIA" },
        { dni: "72019283", name: "IZQUIERDO QUISPE, MIGUEL" },
        { dni: "78920192", name: "JIMENEZ VEGA, DANIELA" },
        { dni: "71293847", name: "LOPEZ CHAVEZ, ROBERTO" },
        { dni: "73920182", name: "MARTINEZ PAREDES, SILVIA" },
        { dni: "76019283", name: "NÚÑEZ SALAZAR, OSCAR" },
        { dni: "72910293", name: "ORTEGA RAMOS, EDGAR" },
        { dni: "74029182", name: "PEREZ VASQUEZ, ELENA" }
      ];

      const detalleData = [];
      const tdpData = [];
      const unicosData = [];

      harvesters.forEach((h, hIdx) => {
        const mod = modalidades[hIdx % 2];
        const sex = sexos[hIdx % 2];
        const cat = categorias[hIdx % 3];
        const placa = placas[hIdx % 4];
        const historico = (hIdx % 3 === 0) ? "REITERANDO" : "NUEVO";

        dates.forEach((dt, dIdx) => {
          const totalKg = 45 + Math.floor(Math.random() * 55);
          const meta = 60;
          const cump = Math.round((totalKg / meta) * 100);
          const rango = cump < 86 ? "0-85%" : cump < 100 ? "86-99%" : cump <= 104 ? "100-104%" : "105%+";
          const semana = "SEM 31";

          detalleData.push({
            "DNI": h.dni,
            "FECHA": dt,
            "SUPERVISOR": "GARCIA JUAN",
            "MODULO|TURNO": "MOD 1 / T1",
            "ACTIVIDAD": "COSECHA",
            "LABOR": "COSECHA ARÁNDANO",
            "TOTAL HRS": 8,
            "TOTAL KG": totalKg,
            "AVANCE": totalKg,
            "ID META": "M1",
            "META (PROD.)": 60,
            "META": 60,
            "VARIEDAD": variedades[dIdx % 3],
            "CUMP. %": cump,
            "CATEG. 2026": cat,
            "RANGO %": rango,
            "APELLIDOS Y NOMBRES": h.name,
            "MODALIDAD": mod,
            "HISTORICO": historico,
            "SEXO": sex,
            "SEMANA": semana,
            "DIA": `DÍA ${dIdx + 1}`
          });

          tdpData.push({
            "FECHA": dt,
            "DNI": h.dni,
            "APELLIDOS Y NOMBRES": h.name,
            "ACTIVIDAD": "COSECHA",
            "TOTAL HRS": 8,
            "TOTAL KG.": totalKg,
            "META": 60,
            "RANGO %": rango,
            "HISTORICO": historico,
            "MODALIDAD": mod,
            "SEXO": sex,
            "PLACA": placa,
            "TIPO UNIDAD": "BUS",
            "RUTA": "HUARMEY - FUNDO",
            "TRANSPORTISTA": transportistas[hIdx % 3],
            "SEMANA": semana,
            "MES": "AGOSTO",
            "DIA": `DÍA ${dIdx + 1}`,
            "ORIGEN": origenes[hIdx % 3],
            "ID FECHA + DNI": `${dt}_${h.dni}`,
            "CUMP. %": cump,
            "CATEG. 2026": cat
          });

          unicosData.push({
            "FECHA": dt,
            "DNI": h.dni,
            "APELLIDOS Y NOMBRES": h.name,
            "ACTIVIDAD": "COSECHA",
            "TOTAL HRS": 8,
            "TOTAL KG.": totalKg,
            "META": 60,
            "RANGO %": rango,
            "CUMP. %": cump,
            "SEMANA": semana,
            "DIA": `DÍA ${dIdx + 1}`,
            "HISTORICO": historico,
            "MODALIDAD": mod,
            "SEXO": sex,
            "ID FECHA + DNI": `${dt}_${h.dni}`,
            "CATEG. 2026": cat
          });
        });
      });

      return {
        DETALLE: detalleData,
        TDP: tdpData,
        UNICOS: unicosData,
        REPORTE: unicosData
      };
    };

    function App() {
      // Navigation state (Pages 1 to 7)
      const [activePage, setActivePage] = useState(1);

      // Data state
      const [data, setData] = useState(null);
      const [loading, setLoading] = useState(true);
      const [isOffline, setIsOffline] = useState(!navigator.onLine);
      const [lastSync, setLastSync] = useState(new Date().toLocaleTimeString());
      const [pwaPrompt, setPwaPrompt] = useState(null);
      const [showTechModal, setShowTechModal] = useState(false);

      // Live Clock State
      const [currentTime, setCurrentTime] = useState(new Date());

      useEffect(() => {
        const timer = setInterval(() => setCurrentTime(new Date()), 1000);
        return () => clearInterval(timer);
      }, []);

      // Online/Offline Listeners
      useEffect(() => {
        const handleOnline = () => setIsOffline(false);
        const handleOffline = () => setIsOffline(true);
        window.addEventListener('online', handleOnline);
        window.addEventListener('offline', handleOffline);

        window.addEventListener('beforeinstallprompt', (e) => {
          e.preventDefault();
          setPwaPrompt(e);
        });

        return () => {
          window.removeEventListener('online', handleOnline);
          window.removeEventListener('offline', handleOffline);
        };
      }, []);

      const fetchData = async () => {
        setLoading(true);
        try {
          // Check IndexedDB / LocalStorage first for instant render
          const cached = localStorage.getItem('agricola_huarmey_data');
          if (cached) {
            setData(JSON.parse(cached));
            setLoading(false);
          }

          if (navigator.onLine) {
            const response = await fetch(API_URL);
            if (response.ok) {
              const resJson = await response.json();
              if (resJson && (resJson.DETALLE || resJson.TDP)) {
                setData(resJson);
                localStorage.setItem('agricola_huarmey_data', JSON.stringify(resJson));
                setLastSync(new Date().toLocaleTimeString());
                setLoading(false);
                return;
              }
            }
          }
        } catch (err) {
          console.warn("Using offline fallback dataset:", err);
        }

        // If fetch fails or offline and no cache, generate mock dataset
        if (!data) {
          const mock = GENERATE_MOCK_DATA();
          setData(mock);
          localStorage.setItem('agricola_huarmey_data', JSON.stringify(mock));
        }
        setLoading(false);
      };

      useEffect(() => {
        fetchData();
      }, []);

      // Install PWA Trigger
      const installPWA = () => {
        if (pwaPrompt) {
          pwaPrompt.prompt();
          pwaPrompt.userChoice.then(() => setPwaPrompt(null));
        }
      };

      // Active dataset getters
      const detalleList = data?.DETALLE || [];
      const tdpList = data?.TDP || [];
      const unicosList = data?.UNICOS || [];

      return (
        <div className="flex-1 flex flex-col min-h-screen">
          {}
          <header className="bg-white border-b border-gray-200 sticky top-0 z-30 shadow-sm">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3 flex flex-col md:flex-row items-center justify-between gap-3">
              
              {/* Brand Logo & Name */}
              <div className="flex items-center gap-3">
                <div className="w-11 h-11 rounded-xl bg-gradient-to-br from-agriRed via-agriRed-dark to-agriGreen p-0.5 shadow-md flex items-center justify-center">
                  <div className="bg-white w-full h-full rounded-[10px] flex items-center justify-center relative overflow-hidden">
                    {/* SVG Blueberry + Leaf logo */}
                    <svg className="w-7 h-7" viewBox="0 0 100 100" fill="none">
                      <path d="M50 20 C25 20, 15 45, 20 70 C25 90, 75 90, 80 70 C85 45, 75 20, 50 20 Z" fill="#E53935" />
                      <path d="M40 25 C60 22, 70 35, 75 55 C60 55, 45 40, 40 25 Z" fill="#388E3C" />
                      <circle cx="45" cy="40" r="4" fill="white" opacity="0.6" />
                    </svg>
                  </div>
                </div>
                <div>
                  <h1 className="text-xl font-bold tracking-tight text-gray-900 flex items-center gap-2">
                    Agrícola Huarmey
                    <span className="text-xs font-semibold px-2 py-0.5 bg-agriGreen-light text-agriGreen-dark rounded-md border border-agriGreen/20">
                      Cosecha 🫐
                    </span>
                  </h1>
                  <p className="text-xs text-gray-500">Sistema de Control & Analítica de Cosecha de Arándanos</p>
                </div>
              </div>

              {/* Status & Live Clock */}
              <div className="flex items-center gap-4 text-xs sm:text-sm">
                {/* Offline/Online Badge */}
                <div className={`flex items-center gap-1.5 px-3 py-1 rounded-full border text-xs font-medium ${
                  isOffline ? 'bg-amber-50 text-amber-800 border-amber-300' : 'bg-emerald-50 text-emerald-800 border-emerald-300'
                }`}>
                  <span className={`w-2 h-2 rounded-full ${isOffline ? 'bg-amber-500 animate-ping' : 'bg-emerald-500'}`}></span>
                  {isOffline ? 'Modo Offline' : 'Conectado'}
                </div>

                {/* Dynamic Clock */}
                <div className="bg-gray-100 px-3 py-1.5 rounded-lg border border-gray-200 text-gray-700 font-mono font-semibold flex items-center gap-2 shadow-inner">
                  <i className="fa-regular fa-clock text-agriRed"></i>
                  <span>{currentTime.toLocaleDateString('es-PE')} {currentTime.toLocaleTimeString('es-PE')}</span>
                </div>

                {/* PWA / Sync Action Buttons */}
                {pwaPrompt && (
                  <button 
                    onClick={installPWA}
                    className="pulse-btn bg-agriGreen text-white px-3 py-1.5 rounded-lg text-xs font-semibold shadow hover:bg-agriGreen-dark transition flex items-center gap-1"
                  >
                    <i className="fa-solid fa-download"></i> Instalar App
                  </button>
                )}

                <button
                  onClick={() => setShowTechModal(true)}
                  className="bg-gray-100 hover:bg-gray-200 text-gray-700 px-2.5 py-1.5 rounded-lg border border-gray-300 transition"
                  title="Configuración API & PWA"
                >
                  <i className="fa-solid fa-gear"></i>
                </button>
              </div>
            </div>

            {/* Navigation Tabs Bar */}
            <div className="bg-gray-50 border-t border-gray-200 overflow-x-auto custom-scrollbar">
              <div className="max-w-7xl mx-auto px-2 flex gap-1 py-1.5 text-xs sm:text-sm font-medium">
                <NavTab id={1} active={activePage} onClick={setActivePage} icon="fa-chart-pie" label="1. Dashboard Cosecha" />
                <NavTab id={2} active={activePage} onClick={setActivePage} icon="fa-list-check" label="2. Reporte Detallado" />
                <NavTab id={3} active={activePage} onClick={setActivePage} icon="fa-weight-hanging" label="3. Reporte Fechas KG" />
                <NavTab id={4} active={activePage} onClick={setActivePage} icon="fa-chart-line" label="4. Reporte Fechas CUMP %" />
                <NavTab id={5} active={activePage} onClick={setActivePage} icon="fa-id-card" label="5. Reporte Reg. Únicos" />
                <NavTab id={6} active={activePage} onClick={setActivePage} icon="fa-truck-front" label="6. Reporte Placas TDP" />
                <NavTab id={7} active={activePage} onClick={setActivePage} icon="fa-flag-checkered" label="7. Reporte Final" />
              </div>
            </div>
          </header>

          {/* Main Content Area */}
          <main className="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6">
            {loading ? (
              <div className="flex flex-col items-center justify-center h-64 gap-3">
                <i className="fa-solid fa-circle-notch fa-spin text-3xl text-agriRed"></i>
                <p className="text-gray-500 font-medium">Cargando información de cosecha...</p>
              </div>
            ) : (
              <>
                {activePage === 1 && <Page1Dashboard data={detalleList} />}
                {activePage === 2 && <Page2ReporteDetallado data={detalleList} />}
                {activePage === 3 && <Page3FechasKg data={tdpList} />}
                {activePage === 4 && <Page4FechasCump data={tdpList} />}
                {activePage === 5 && <Page5RegUnicos data={unicosList} />}
                {activePage === 6 && <Page6PlacasTdp data={tdpList} />}
                {activePage === 7 && <Page7ReporteFinal data={tdpList} />}
              </>
            )}
          </main>

          {}
          {showTechModal && (
            <TechSpecModal 
              onClose={() => setShowTechModal(false)}
              onRefresh={fetchData}
              lastSync={lastSync}
            />
          )}

          {/* Footer */}
          <footer className="bg-white border-t border-gray-200 py-3 text-center text-xs text-gray-500">
            Agrícola Huarmey S.A. &copy; 2026 - Control de Cosecha PWA (Offline-First)
          </footer>
        </div>
      );
    }

    // NavTab Component
    function NavTab({ id, active, onClick, icon, label }) {
      const isActive = active === id;
      return (
        <button
          onClick={() => onClick(id)}
          className={`flex items-center gap-1.5 px-3 py-2 rounded-lg whitespace-nowrap transition font-semibold ${
            isActive 
              ? 'bg-agriRed text-white shadow-sm' 
              : 'text-gray-600 hover:text-agriRed hover:bg-white'
          }`}
        >
          <i className={`fa-solid ${icon}`}></i>
          <span>{label}</span>
        </button>
      );
    }

    function Page1Dashboard({ data }) {
      // Filters state
      const [filterFecha, setFilterFecha] = useState('');
      const [filterSemana, setFilterSemana] = useState('');
      const [filterCateg, setFilterCateg] = useState('');
      const [filterModalidad, setFilterModalidad] = useState('');
      const [filterRango, setFilterRango] = useState('');

      // Sorting state for Table 1.6
      const [sortKgDir, setSortKgDir] = useState('desc');

      // Filter Options
      const fechasOpt = useMemo(() => [...new Set(data.map(d => d.FECHA))].filter(Boolean), [data]);
      const semanasOpt = useMemo(() => [...new Set(data.map(d => d.SEMANA))].filter(Boolean), [data]);
      const categOpt = useMemo(() => [...new Set(data.map(d => d['CATEG. 2026']))].filter(Boolean), [data]);
      const modOpt = useMemo(() => [...new Set(data.map(d => d.MODALIDAD))].filter(Boolean), [data]);
      const rangoOpt = useMemo(() => [...new Set(data.map(d => d['RANGO %']))].filter(Boolean), [data]);

      // Filtered records
      const filtered = useMemo(() => {
        return data.filter(item => {
          if (filterFecha && item.FECHA !== filterFecha) return false;
          if (filterSemana && item.SEMANA !== filterSemana) return false;
          if (filterCateg && item['CATEG. 2026'] !== filterCateg) return false;
          if (filterModalidad && item.MODALIDAD !== filterModalidad) return false;
          if (filterRango && item['RANGO %'] !== filterRango) return false;
          return true;
        });
      }, [data, filterFecha, filterSemana, filterCateg, filterModalidad, filterRango]);

      // 1.4 KPIs
      const totalKg = useMemo(() => filtered.reduce((acc, curr) => acc + (parseFloat(curr['TOTAL KG']) || 0), 0), [filtered]);
      const totalCumpAvg = useMemo(() => {
        if (!filtered.length) return 0;
        const sum = filtered.reduce((acc, curr) => acc + (parseFloat(curr['CUMP. %']) || 0), 0);
        return sum / filtered.length;
      }, [filtered]);
      const totalCosechadores = useMemo(() => new Set(filtered.map(d => d.DNI)).size, [filtered]);

      // Data for Modalidad Donut
      const modStats = useMemo(() => {
        const map = {};
        filtered.forEach(d => {
          const m = d.MODALIDAD || 'OTRO';
          if (!map[m]) map[m] = new Set();
          map[m].add(d.DNI);
        });
        const totalUnique = new Set(filtered.map(d => d.DNI)).size || 1;
        return Object.keys(map).map(m => ({
          name: m,
          count: map[m].size,
          pct: Math.round((map[m].size / totalUnique) * 100)
        }));
      }, [filtered]);

      // Data for Sexo Donut
      const sexStats = useMemo(() => {
        const map = {};
        filtered.forEach(d => {
          const s = d.SEXO === 'M' ? 'Masculino' : d.SEXO === 'F' ? 'Femenino' : 'Otro';
          if (!map[s]) map[s] = new Set();
          map[s].add(d.DNI);
        });
        const totalUnique = new Set(filtered.map(d => d.DNI)).size || 1;
        return Object.keys(map).map(s => ({
          name: s,
          count: map[s].size,
          pct: Math.round((map[s].size / totalUnique) * 100)
        }));
      }, [filtered]);

      // Table 1.6: FECHA, TOTAL KG., TOTAL COSECHADORES (unique DNI), TOTAL PROMEDIO (TOTAL KG / TOTAL COSECHADORES)
      const table16Data = useMemo(() => {
        const byDate = {};
        filtered.forEach(d => {
          const f = d.FECHA;
          if (!byDate[f]) byDate[f] = { fecha: f, totalKg: 0, dnis: new Set() };
          byDate[f].totalKg += (parseFloat(d['TOTAL KG']) || 0);
          byDate[f].dnis.add(d.DNI);
        });

        let list = Object.values(byDate).map(item => {
          const cosechadores = item.dnis.size;
          const avg = cosechadores > 0 ? item.totalKg / cosechadores : 0;
          return {
            fecha: item.fecha,
            totalKg: item.totalKg,
            cosechadores,
            promedioKg: avg
          };
        });

        list.sort((a, b) => sortKgDir === 'asc' ? a.totalKg - b.totalKg : b.totalKg - a.totalKg);
        return list;
      }, [filtered, sortKgDir]);

      // Table 1.7: MODALIDAD, TOTAL COSECHADORES (unique by Date), TOTAL CUMP. % (Filter Campamento & Ida/Vuelta)

    // Pie Visual Render Helper
    function PieVisual({ data, isSex }) {
      const canvasRef = useRef(null);

      useEffect(() => {
        if (!canvasRef.current || !data || !data.length) return;
        const ctx = canvasRef.current.getContext('2d');
        const chart = new Chart(ctx, {
          type: 'doughnut',
          data: {
            labels: data.map(d => d.name),
            datasets: [{
              data: data.map(d => d.count),
              backgroundColor: isSex ? ['#2563EB', '#EC4899', '#9CA3AF'] : ['#E53935', '#388E3C', '#F59E0B'],
              borderWidth: 2,
              borderColor: '#ffffff'
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            cutout: '65%'
          }
        });
        return () => chart.destroy();
      }, [data, isSex]);

      return <canvas ref={canvasRef} className="w-full h-full" />;
    }

      const modOpt = useMemo(() => [...new Set(data.map(d => d.MODALIDAD))].filter(Boolean), [data]);
      const rangoOpt = useMemo(() => [...new Set(data.map(d => d['RANGO %']))].filter(Boolean), [data]);

          </div>

    }

    function Page7ReporteFinal({ data }) {
      const [filterFecha, setFilterFecha] = useState('');
      const [filterSemana, setFilterSemana] = useState('');
      const [filterCateg, setFilterCateg] = useState('');
      const [filterModalidad, setFilterModalidad] = useState('');
      const [filterRango, setFilterRango] = useState('');

      const [sortCol, setSortCol] = useState('name');
      const [sortDir, setSortDir] = useState('asc');
      const [page, setPage] = useState(1);
      const pageSize = 50;

      const fechasOpt = useMemo(() => [...new Set(data.map(d => d.FECHA))].filter(Boolean), [data]);
      const semanasOpt = useMemo(() => [...new Set(data.map(d => d.SEMANA))].filter(Boolean), [data]);
      const categOpt = useMemo(() => [...new Set(data.map(d => d['CATEG. 2026']))].filter(Boolean), [data]);
      const modOpt = useMemo(() => [...new Set(data.map(d => d.MODALIDAD))].filter(Boolean), [data]);
      const rangoOpt = useMemo(() => [...new Set(data.map(d => d['RANGO %']))].filter(Boolean), [data]);

      const filtered = useMemo(() => {
        return data.filter(item => {
          if (filterFecha && item.FECHA !== filterFecha) return false;
          if (filterSemana && item.SEMANA !== filterSemana) return false;
          if (filterCateg && item['CATEG. 2026'] !== filterCateg) return false;
          if (filterModalidad && item.MODALIDAD !== filterModalidad) return false;
          if (filterRango && item['RANGO %'] !== filterRango) return false;
          return true;
        });
      }, [data, filterFecha, filterSemana, filterCateg, filterModalidad, filterRango]);

      // 7.5.1 Main Harvester Table: DNI, APELLIDOS Y NOMBRES, MODALIDAD, HISTORICO, CUMP. %, TOTAL DIAS, CATEG. 2026, RANGO %
      const mainHarvesterData = useMemo(() => {
        const map = {};
        filtered.forEach(d => {
          const key = d.DNI;
          if (!map[key]) {
            map[key] = {
              dni: d.DNI,
              name: d['APELLIDOS Y NOMBRES'],
              modalidad: d.MODALIDAD,
              historico: d.HISTORICO,
              dates: new Set(),
              cumpSum: 0,
              count: 0,
              categ: d['CATEG. 2026'],
              rango: d['RANGO %']
            };
          }
          map[key].dates.add(d.FECHA);
          map[key].cumpSum += (parseFloat(d['CUMP. %']) || 0);
          map[key].count += 1;
        });

        let list = Object.values(map).map(item => ({
          ...item,
          totalDias: item.dates.size,
          cumpAvg: item.count > 0 ? item.cumpSum / item.count : 0
        }));

        list.sort((a, b) => {
          let valA = a[sortCol] || '';
          let valB = b[sortCol] || '';
          return sortDir === 'asc' ? valA.localeCompare(valB) : valB.localeCompare(valA);
        });
        return list;
      }, [filtered, sortCol, sortDir]);

      const totalPages = Math.ceil(mainHarvesterData.length / pageSize) || 1;
      const paginated = useMemo(() => {
        const start = (page - 1) * pageSize;
        return mainHarvesterData.slice(start, start + pageSize);
      }, [mainHarvesterData, page]);

      // 7.6.1 Table 2A: MODALIDAD, HISTORICO, TOTAL KG, CUMP. %
      const table2AData = useMemo(() => {
        const map = {};
        filtered.forEach(d => {
          const key = `${d.MODALIDAD}_${d.HISTORICO}`;
          if (!map[key]) {
            map[key] = {
              modalidad: d.MODALIDAD,
              historico: d.HISTORICO,
              totalKg: 0,
              cumpSum: 0,
              count: 0
            };
          }
          map[key].totalKg += (parseFloat(d['TOTAL KG.'] || d['TOTAL KG']) || 0);
          map[key].cumpSum += (parseFloat(d['CUMP. %']) || 0);
          map[key].count += 1;
        });

        return Object.values(map).map(item => ({
          ...item,
          cumpAvg: item.count > 0 ? item.cumpSum / item.count : 0
        }));
      }, [filtered]);

      // 7.6.2 Table 2B: MODALIDAD, CATEG. 2026, TOTAL KG, CUMP. %
      const table2BData = useMemo(() => {
        const map = {};
        filtered.forEach(d => {
          const key = `${d.MODALIDAD}_${d['CATEG. 2026']}`;
          if (!map[key]) {
            map[key] = {
              modalidad: d.MODALIDAD,
              categ: d['CATEG. 2026'],
              totalKg: 0,
              cumpSum: 0,
              count: 0
            };
          }
          map[key].totalKg += (parseFloat(d['TOTAL KG.'] || d['TOTAL KG']) || 0);
          map[key].cumpSum += (parseFloat(d['CUMP. %']) || 0);
          map[key].count += 1;
        });

        return Object.values(map).map(item => ({
          ...item,
          cumpAvg: item.count > 0 ? item.cumpSum / item.count : 0
        }));
      }, [filtered]);

      const toggleSort = (col) => {
        if (sortCol === col) setSortDir(prev => prev === 'asc' ? 'desc' : 'asc');
        else { setSortCol(col); setSortDir('asc'); }
      };

      return (
        <div className="space-y-6">
          <div className="flex items-center justify-between bg-white p-4 rounded-xl border border-gray-200 shadow-sm">
            <div className="flex items-center gap-3">
              <span className="text-3xl">🏁</span>
              <div>
                <h2 className="text-xl font-bold text-gray-900">Reporte Final</h2>
                <p className="text-xs text-gray-500">Consolidado general de producción e indicadores finales</p>
              </div>
            </div>
            <ComplianceLegend />
          </div>

          <div className="bg-white p-4 rounded-xl border border-gray-200 shadow-sm space-y-3 text-xs">
            <div className="grid grid-cols-2 md:grid-cols-5 gap-3">
              <div>
                <label className="font-bold text-gray-700 block mb-1">FECHA</label>
                <select value={filterFecha} onChange={e => setFilterFecha(e.target.value)} className="w-full border p-2 rounded bg-gray-50">
                  <option value="">Todas</option>
                  {fechasOpt.map(f => <option key={f} value={f}>{formatDateStr(f)}</option>)}
                </select>
              </div>

              <div>
                <label className="font-bold text-gray-700 block mb-1">SEMANA</label>
                <select value={filterSemana} onChange={e => setFilterSemana(e.target.value)} className="w-full border p-2 rounded bg-gray-50">
                  <option value="">Todas</option>
                  {semanasOpt.map(s => <option key={s} value={s}>{s}</option>)}
                </select>
              </div>

              <div>
                <label className="font-bold text-gray-700 block mb-1">CATEG. 2026</label>
                <select value={filterCateg} onChange={e => setFilterCateg(e.target.value)} className="w-full border p-2 rounded bg-gray-50">
                  <option value="">Todas</option>
                  {categOpt.map(c => <option key={c} value={c}>{c}</option>)}
                </select>
              </div>

              <div>
                <label className="font-bold text-gray-700 block mb-1">MODALIDAD</label>
                <select value={filterModalidad} onChange={e => setFilterModalidad(e.target.value)} className="w-full border p-2 rounded bg-gray-50">
                  <option value="">Todas</option>
                  {modOpt.map(m => <option key={m} value={m}>{m}</option>)}
                </select>
              </div>

              <div>
                <label className="font-bold text-gray-700 block mb-1">RANGO %</label>
                <select value={filterRango} onChange={e => setFilterRango(e.target.value)} className="w-full border p-2 rounded bg-gray-50">
                  <option value="">Todos</option>
                  {rangoOpt.map(r => <option key={r} value={r}>{r}</option>)}
                </select>
              </div>
            </div>
          </div>

          {}
          <div className="bg-white rounded-2xl border border-gray-200 shadow-sm overflow-hidden">
            <div className="p-4 border-b bg-gray-50 font-bold text-gray-800 text-sm flex items-center justify-between">
              <span><i className="fa-solid fa-users-gear text-agriRed mr-2"></i>Consolidado por Cosechador</span>
              <span className="text-xs text-gray-500 font-normal">Mostrando 50 por página</span>
            </div>
            <div className="overflow-x-auto">
              <table className="w-full text-left text-xs border-collapse">
                <thead>
                  <tr className="bg-gray-100 border-b text-gray-700 font-bold uppercase">
                    <th className="p-3">DNI</th>
                    <th className="p-3">
                      <button onClick={() => toggleSort('name')} className="flex items-center gap-1 hover:text-agriRed">
                        APELLIDOS Y NOMBRES <i className="fa-solid fa-sort"></i>
                      </button>
                    </th>
                    <th className="p-3">MODALIDAD</th>
                    <th className="p-3">HISTÓRICO</th>
                    <th className="p-3 text-center">CUMP. %</th>
                    <th className="p-3 text-right">TOTAL DÍAS</th>
                    <th className="p-3">CATEG. 2026</th>
                    <th className="p-3">RANGO %</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-gray-200">
                  {paginated.map((row, idx) => (
                    <tr key={idx} className="hover:bg-gray-50">
                      <td className="p-3 font-mono text-gray-600">{row.dni}</td>
                      <td className="p-3 font-bold text-gray-900">{row.name}</td>
                      <td className="p-3 text-gray-600">{row.modalidad}</td>
                      <td className="p-3 text-gray-600">{row.historico}</td>
                      <td className="p-3 text-center">{getComplianceBadge(row.cumpAvg)}</td>
                      <td className="p-3 text-right font-extrabold text-gray-800">{formatNumber(row.totalDias)}</td>
                      <td className="p-3 text-gray-700">{row.categ}</td>
                      <td className="p-3 text-gray-700">{row.rango}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>

            <PaginationControls page={page} setPage={setPage} totalPages={totalPages} />
          </div>

          {/* 7.6 Summary Tables (Modalidad vs Histórico & Modalidad vs Categ) */}
          <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
            
            {/* Table 2A */}
            <div className="bg-white p-5 rounded-2xl border border-gray-200 shadow-sm">
              <h3 className="font-bold text-gray-800 text-sm mb-3 flex items-center gap-2">
                <i className="fa-solid fa-layer-group text-agriRed"></i> Resumen: Modalidad vs Histórico
              </h3>
              <div className="overflow-x-auto">
                <table className="w-full text-left text-xs border-collapse">
                  <thead>
                    <tr className="bg-gray-50 border-b text-gray-600 font-bold">
                      <th className="p-2">MODALIDAD</th>
                      <th className="p-2">HISTÓRICO</th>
                      <th className="p-2 text-right">TOTAL KG</th>
                      <th className="p-2 text-center">CUMP. %</th>
                    </tr>
                  </thead>
                  <tbody>
                    {table2AData.map((row, idx) => (
                      <tr key={idx} className="border-b hover:bg-gray-50">
                        <td className="p-2 font-bold text-gray-800">{row.modalidad}</td>
                        <td className="p-2 text-gray-600">{row.historico}</td>
                        <td className="p-2 text-right font-bold text-agriRed">{formatNumber(row.totalKg)} kg</td>
                        <td className="p-2 text-center">{getComplianceBadge(row.cumpAvg)}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>

            {/* Table 2B */}
            <div className="bg-white p-5 rounded-2xl border border-gray-200 shadow-sm">
              <h3 className="font-bold text-gray-800 text-sm mb-3 flex items-center gap-2">
                <i className="fa-solid fa-tags text-agriGreen"></i> Resumen: Modalidad vs Categ. 2026
              </h3>
              <div className="overflow-x-auto">
                <table className="w-full text-left text-xs border-collapse">
                  <thead>
                    <tr className="bg-gray-50 border-b text-gray-600 font-bold">
                      <th className="p-2">MODALIDAD</th>
                      <th className="p-2">CATEG. 2026</th>
                      <th className="p-2 text-right">TOTAL KG</th>
                      <th className="p-2 text-center">CUMP. %</th>
                    </tr>
                  </thead>
                  <tbody>
                    {table2BData.map((row, idx) => (
                      <tr key={idx} className="border-b hover:bg-gray-50">
                        <td className="p-2 font-bold text-gray-800">{row.modalidad}</td>
                        <td className="p-2 text-gray-600">{row.categ}</td>
                        <td className="p-2 text-right font-bold text-agriGreen">{formatNumber(row.totalKg)} kg</td>
                        <td className="p-2 text-center">{getComplianceBadge(row.cumpAvg)}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>

          </div>
        </div>
      );
    }

    // Shared Compliance Legend Component
    function ComplianceLegend() {
      return (
        <div className="hidden lg:flex items-center gap-2 text-[11px] bg-gray-50 p-2 rounded-lg border border-gray-200">
          <span className="font-bold text-gray-700">Cumplimiento:</span>
          <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded-full bg-red-500"></span> Malo (0-85%)</span>
          <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded-full bg-orange-500"></span> Regular (86-99%)</span>
          <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded-full bg-green-500"></span> Bueno (100-104%)</span>
          <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded-full bg-blue-500"></span> Excelente (105%+)</span>
        </div>
      );
    }

    // Shared Pagination Controls Component
    function PaginationControls({ page, setPage, totalPages }) {
      return (
        <div className="p-3 bg-gray-50 border-t flex items-center justify-between text-xs">
          <button
            disabled={page === 1}
            onClick={() => setPage(p => Math.max(p - 1, 1))}
            className="px-3 py-1.5 bg-white border rounded-lg font-semibold text-gray-700 disabled:opacity-50 disabled:cursor-not-allowed hover:bg-gray-100"
          >
            <i className="fa-solid fa-chevron-left mr-1"></i> Anterior
          </button>
          <span className="font-semibold text-gray-600">Página {page} de {totalPages}</span>
          <button
            disabled={page >= totalPages}
            onClick={() => setPage(p => Math.min(p + 1, totalPages))}
            className="px-3 py-1.5 bg-white border rounded-lg font-semibold text-gray-700 disabled:opacity-50 disabled:cursor-not-allowed hover:bg-gray-100"
          >
            Siguiente <i className="fa-solid fa-chevron-right ml-1"></i>
          </button>
        </div>
      );
    }

    function TechSpecModal({ onClose, onRefresh, lastSync }) {
      const [activeTab, setActiveTab] = useState('sync');

      const gasCode = `/**
 * Google Apps Script Backend for Agrícola Huarmey
 * Spreadsheet Name: BD_COSECHA (Detalle)
 * Sheets: DETALLE, TDP, UNICOS, REPORTE
 */
function doGet(e) {
  const ss = SpreadsheetApp.getActiveSpreadsheet();
  
  function getSheetData(sheetName) {
    const sheet = ss.getSheetByName(sheetName);
    if (!sheet) return [];
    const values = sheet.getDataRange().getValues();
    if (values.length < 2) return [];
    const headers = values[0];
    return values.slice(1).map(row => {
      let obj = {};
      headers.forEach((h, i) => {
        let val = row[i];
        if (val instanceof Date) {
          val = Utilities.formatDate(val, "America/Lima", "dd/MM/yyyy");
        }
        obj[h] = val;
      });
      return obj;
    });
  }

  const result = {
    status: "success",
    timestamp: new Date().toISOString(),
    DETALLE: getSheetData("DETALLE"),
    TDP: getSheetData("TDP"),
    UNICOS: getSheetData("UNICOS"),
    REPORTE: getSheetData("REPORTE")
  };

  return ContentService.createTextOutput(JSON.stringify(result))
    .setMimeType(ContentService.MimeType.JSON);
}`;

      const manifestCode = `{
  "short_name": "AgriHuarmey",
  "name": "Agrícola Huarmey - Cosecha",
  "icons": [
    {
      "src": "icon-192.png",
      "type": "image/png",
      "sizes": "192x192"
    }
  ],
  "start_url": "./index.html",
  "background_color": "#ffffff",
  "theme_color": "#E53935",
  "display": "standalone"
}`;

      const swCode = `// Service Worker for Offline Caching
const CACHE_NAME = 'agri-huarmey-v1';
const ASSETS = ['./', './index.html'];

self.addEventListener('install', (e) => {
  e.waitUntil(caches.open(CACHE_NAME).then(cache => cache.addAll(ASSETS)));
});

self.addEventListener('fetch', (e) => {
  e.respondWith(
    caches.match(e.request).then(response => response || fetch(e.request))
  );
});`;

      return (
        <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
          <div className="bg-white rounded-2xl max-w-3xl w-full max-h-[90vh] flex flex-col shadow-2xl overflow-hidden">
            <div className="p-4 bg-agriRed text-white font-bold flex items-center justify-between">
              <span className="flex items-center gap-2">
                <i className="fa-solid fa-code"></i> Configuración Técnica, API & Archivos PWA
              </span>
              <button onClick={onClose} className="hover:opacity-80 text-lg">
                <i className="fa-solid fa-xmark"></i>
              </button>
            </div>

            <div className="flex border-b bg-gray-50 text-xs font-semibold">
              <button onClick={() => setActiveTab('sync')} className={`px-4 py-2.5 border-b-2 ${activeTab === 'sync' ? 'border-agriRed text-agriRed bg-white' : 'text-gray-600'}`}>
                Sincronización
              </button>
              <button onClick={() => setActiveTab('gas')} className={`px-4 py-2.5 border-b-2 ${activeTab === 'gas' ? 'border-agriRed text-agriRed bg-white' : 'text-gray-600'}`}>
                código.gs
              </button>
              <button onClick={() => setActiveTab('manifest')} className={`px-4 py-2.5 border-b-2 ${activeTab === 'manifest' ? 'border-agriRed text-agriRed bg-white' : 'text-gray-600'}`}>
                manifest.json
              </button>
              <button onClick={() => setActiveTab('sw')} className={`px-4 py-2.5 border-b-2 ${activeTab === 'sw' ? 'border-agriRed text-agriRed bg-white' : 'text-gray-600'}`}>
                service-worker.js
              </button>
            </div>

            <div className="p-5 flex-1 overflow-y-auto text-xs space-y-4">
              {activeTab === 'sync' && (
                <div className="space-y-4">
                  <div className="p-3 bg-gray-50 border rounded-lg">
                    <p className="font-bold text-gray-800">API Endpoint Google Sheets:</p>
                    <p className="font-mono text-xs text-agriRed break-all mt-1">{API_URL}</p>
                    <p className="text-gray-500 text-[11px] mt-1">Última sincronización local: {lastSync}</p>
                  </div>

                  <div className="flex gap-2">
                    <button
                      onClick={() => { onRefresh(); onClose(); }}
                      className="bg-agriGreen text-white px-4 py-2 rounded-lg font-bold shadow hover:bg-agriGreen-dark"
                    >
                      <i className="fa-solid fa-rotate mr-1.5"></i> Sincronizar Ahora con Google Sheets
                    </button>
                  </div>
                </div>
              )}

              {activeTab === 'gas' && (
                <div>
                  <p className="text-gray-600 mb-2">Código para Google Apps Script (Backend Google Sheets):</p>
                  <pre className="p-3 bg-gray-900 text-green-400 rounded-lg overflow-x-auto font-mono text-[11px] leading-relaxed">
                    {gasCode}
                  </pre>
                </div>
              )}

              {activeTab === 'manifest' && (
                <div>
                  <p className="text-gray-600 mb-2">Manifest de la PWA (manifest.json):</p>
                  <pre className="p-3 bg-gray-900 text-amber-300 rounded-lg overflow-x-auto font-mono text-[11px] leading-relaxed">
                    {manifestCode}
                  </pre>
                </div>
              )}

              {activeTab === 'sw' && (
                <div>
                  <p className="text-gray-600 mb-2">Service Worker Offline (service-worker.js):</p>
                  <pre className="p-3 bg-gray-900 text-cyan-300 rounded-lg overflow-x-auto font-mono text-[11px] leading-relaxed">
                    {swCode}
                  </pre>

            </div>

            <div className="p-3 bg-gray-50 border-t text-right">
              <button onClick={onClose} className="px-4 py-1.5 bg-gray-200 hover:bg-gray-300 rounded-lg font-semibold text-gray-800">
                Cerrar
              </button>
            </div>
          </div>
        </div>
      );
    }

    // Render Root
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>

  <!-- Register Service Worker inline for PWA capability -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        const swBlob = new Blob([`
          const CACHE_NAME = 'agri-huarmey-cache-v1';
          self.addEventListener('install', (e) => {
            self.skipWaiting();
          });
          self.addEventListener('fetch', (e) => {
            e.respondWith(
              caches.match(e.request).then(res => res || fetch(e.request).catch(() => res))
            );
          });
        `], { type: 'text/javascript' });
        navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(err => console.log('SW Reg Error:', err));
      });
    }
  </script>

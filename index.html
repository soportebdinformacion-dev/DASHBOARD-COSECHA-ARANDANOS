<style>
:root{
  --rojo-900:#7A2E22;
  --rojo-700:#B34432;
  --rojo-500:#D9553D;
  --rojo-200:#F6D3C6;
  --rojo-100:#FBEAE2;
  --verde-800:#3A6B2E;
  --verde-600:#5C9143;
  --verde-400:#8CBF6E;
  --verde-100:#E7F2DE;
  --crema:#FCF9F3;
  --crema-2:#F5EEE2;
  --tinta:#2F2A24;
  --tinta-60:#6C6459;
  --linea:#E7DFCF;
  --blanco:#FFFFFF;
  --azul:#2E6E9E;
  --azul-100:#DCEBF4;
  --naranja:#C9821F;
  --naranja-100:#F7E7CC;
  --malo:#C0392B;
  --regular:#C9821F;
  --bueno:#3A6B2E;
  --excelente:#2E6E9E;
  --radius-s:10px;
  --radius-m:16px;
  --radius-l:22px;
  --shadow-card:0 1px 2px rgba(47,42,36,.06), 0 8px 24px -12px rgba(47,42,36,.18);
  --font-display:'Fraunces', serif;
  --font-body:'Manrope', sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--font-body);
  background:var(--crema);
  color:var(--tinta);
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
  overflow-x:hidden;
}
::selection{background:var(--rojo-200);}
a{color:inherit;}
button{font-family:inherit;}
h1,h2,h3{font-family:var(--font-display);font-weight:600;margin:0;letter-spacing:-.01em;}
.app-shell{
  display:grid;
  grid-template-columns:232px 1fr;
  min-height:100vh;
}
/* ---------- Sidebar ---------- */
.sidebar{
  background:linear-gradient(184deg, var(--rojo-900) 0%, #5E2419 100%);
  color:#F8E9E3;
  padding:22px 14px 18px;
  display:flex;
  flex-direction:column;
  gap:4px;
  position:sticky;
  top:0;
  height:100vh;
}
.brand{
  display:flex;
  align-items:center;
  gap:10px;
  padding:4px 10px 22px;
}
.brand img{width:38px;height:38px;object-fit:contain;filter:drop-shadow(0 2px 4px rgba(0,0,0,.25));}
.brand-text{line-height:1.15;}
.brand-text b{display:block;font-family:var(--font-display);font-size:16.5px;font-weight:600;color:#fff;}
.brand-text span{display:block;font-size:11px;color:#E7C3B7;letter-spacing:.03em;}
.nav-list{display:flex;flex-direction:column;gap:2px;margin-top:6px;}
.nav-item{
  display:flex;align-items:center;gap:11px;
  padding:10px 12px;border-radius:12px;
  color:#F1D9CF;font-size:13.5px;font-weight:600;
  cursor:pointer;border:none;background:transparent;text-align:left;width:100%;
  transition:background .15s ease, color .15s ease;
}
.nav-item svg{width:18px;height:18px;flex:none;opacity:.85;}
.nav-item:hover{background:rgba(255,255,255,.08);color:#fff;}
.nav-item.active{background:#F8E9E3;color:var(--rojo-900);}
.nav-item.active svg{opacity:1;}
.sidebar-foot{margin-top:auto;padding:12px 12px 0;font-size:11px;color:#D9AFA1;border-top:1px solid rgba(255,255,255,.12);padding-top:14px;}
.sync-pill{
  display:flex;align-items:center;gap:7px;font-size:11.5px;font-weight:700;
  padding:7px 10px;border-radius:999px;background:rgba(255,255,255,.09);color:#F8E9E3;margin-bottom:8px;
}
.sync-dot{width:7px;height:7px;border-radius:50%;background:#8CBF6E;box-shadow:0 0 0 3px rgba(140,191,110,.25);}
.sync-pill.offline .sync-dot{background:#E0A24D;box-shadow:0 0 0 3px rgba(224,162,77,.25);}

/* ---------- Main ---------- */
.main{min-width:0;padding:26px 30px 90px;}
.page-header{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:20px;flex-wrap:wrap;gap:14px;
}
.page-title{display:flex;align-items:center;gap:12px;}
.page-title .icon-badge{
  width:42px;height:42px;border-radius:13px;
  background:var(--rojo-100);color:var(--rojo-700);
  display:flex;align-items:center;justify-content:center;
}
.page-title .icon-badge svg{width:22px;height:22px;}
.page-title h1{font-size:22px;color:var(--tinta);}
.page-title p{margin:1px 0 0;font-size:12.5px;color:var(--tinta-60);font-weight:500;}
.clock-card{
  display:flex;align-items:center;gap:10px;
  background:var(--blanco);border:1px solid var(--linea);
  border-radius:14px;padding:9px 16px;box-shadow:var(--shadow-card);
}
.clock-card svg{width:19px;height:19px;color:var(--rojo-700);}
.clock-date{font-size:12px;color:var(--tinta-60);font-weight:600;text-transform:capitalize;}
.clock-time{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--tinta);}

/* ---------- Filters ---------- */
.filter-bar{
  display:flex;flex-wrap:wrap;gap:10px;margin-bottom:18px;
  background:var(--blanco);border:1px solid var(--linea);border-radius:16px;padding:14px;box-shadow:var(--shadow-card);
  align-items:center;
}
.filter-field{display:flex;align-items:center;gap:7px;background:var(--crema-2);border:1px solid var(--linea);border-radius:10px;padding:8px 11px;}
.filter-field svg{width:15px;height:15px;color:var(--rojo-700);flex:none;}
.filter-field label{font-size:10.5px;font-weight:700;color:var(--tinta-60);text-transform:uppercase;letter-spacing:.04em;margin-right:2px;white-space:nowrap;}
.filter-field select,.filter-field input{
  border:none;background:transparent;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--tinta);outline:none;min-width:64px;
}
.search-field{flex:1 1 220px;max-width:320px;}
.search-field input{width:100%;}
.filter-clear{
  margin-left:auto;font-size:12px;font-weight:700;color:var(--rojo-700);background:var(--rojo-100);
  border:none;border-radius:10px;padding:8px 14px;cursor:pointer;
}
.filter-clear:hover{background:var(--rojo-200);}

/* ---------- Legend ---------- */
.legend-bar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:18px;}
.legend-chip{
  display:flex;align-items:center;gap:8px;background:var(--blanco);border:1px solid var(--linea);
  border-radius:12px;padding:8px 13px;font-size:12px;font-weight:700;box-shadow:var(--shadow-card);
}
.legend-dot{width:11px;height:11px;border-radius:4px;}
.legend-chip .rango{font-weight:600;color:var(--tinta-60);}

/* ---------- KPI cards ---------- */
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-bottom:18px;}
.kpi-card{
  background:var(--blanco);border:1px solid var(--linea);border-radius:18px;padding:18px 20px;
  box-shadow:var(--shadow-card);position:relative;overflow:hidden;
}
.kpi-card::after{content:"";position:absolute;right:-18px;top:-18px;width:80px;height:80px;border-radius:50%;background:var(--accent-tint,var(--rojo-100));opacity:.6;}
.kpi-top{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:1;}
.kpi-icon{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;background:var(--accent-tint,var(--rojo-100));color:var(--accent,var(--rojo-700));}
.kpi-icon svg{width:20px;height:20px;}
.kpi-label{font-size:11.5px;font-weight:700;color:var(--tinta-60);text-transform:uppercase;letter-spacing:.04em;margin-top:12px;position:relative;z-index:1;}
.kpi-value{font-family:var(--font-display);font-size:29px;font-weight:700;margin-top:3px;position:relative;z-index:1;color:var(--tinta);}
.kpi-sub{font-size:11.5px;color:var(--tinta-60);margin-top:2px;font-weight:600;position:relative;z-index:1;}

/* ---------- Chart cards ---------- */
.chart-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;margin-bottom:18px;}
.card{background:var(--blanco);border:1px solid var(--linea);border-radius:18px;padding:18px 20px;box-shadow:var(--shadow-card);}
.card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.card-head h3{font-size:14.5px;font-weight:700;color:var(--tinta);}
.card-head .card-icn{width:26px;height:26px;border-radius:8px;background:var(--verde-100);color:var(--verde-800);display:flex;align-items:center;justify-content:center;}
.card-head .card-icn svg{width:15px;height:15px;}
.donut-wrap{display:flex;align-items:center;gap:16px;}
.donut-canvas-box{position:relative;width:150px;height:150px;flex:none;}
.donut-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;}
.donut-center b{font-family:var(--font-display);font-size:20px;line-height:1;color:var(--tinta);}
.donut-center span{font-size:10.5px;color:var(--tinta-60);font-weight:700;margin-top:2px;}
.donut-legend{display:flex;flex-direction:column;gap:8px;flex:1;min-width:0;}
.donut-legend-item{display:flex;align-items:center;gap:8px;font-size:12.5px;}
.donut-legend-item .sw{width:10px;height:10px;border-radius:3px;flex:none;}
.donut-legend-item .nm{flex:1;font-weight:700;color:var(--tinta);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.donut-legend-item .vl{font-weight:800;color:var(--tinta-60);font-variant-numeric:tabular-nums;}

/* ---------- Tables ---------- */
.table-scroll{overflow:auto;border-radius:14px;border:1px solid var(--linea);}
table.data-table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:560px;}
table.data-table thead th{
  position:sticky;top:0;background:var(--rojo-900);color:#F8E9E3;text-align:left;
  padding:11px 13px;font-weight:700;font-size:11.3px;text-transform:uppercase;letter-spacing:.03em;white-space:nowrap;z-index:2;
}
table.data-table thead th.sortable{cursor:pointer;user-select:none;}
table.data-table thead th .th-flex{display:flex;align-items:center;gap:5px;}
table.data-table thead th svg{width:12px;height:12px;opacity:.75;}
table.data-table tbody td{padding:9.5px 13px;border-bottom:1px solid var(--linea);white-space:nowrap;color:var(--tinta);}
table.data-table tbody tr:nth-child(even){background:var(--crema-2);}
table.data-table tbody tr:hover{background:var(--rojo-100);}
table.data-table tbody td.num{font-variant-numeric:tabular-nums;text-align:right;font-weight:700;}
.rank-badge{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:8px;font-weight:800;font-size:11.5px;background:var(--crema-2);color:var(--tinta-60);}
.rank-badge.r1{background:#F4D06F;color:#7A5A00;}
.rank-badge.r2{background:#DCE3E8;color:#546472;}
.rank-badge.r3{background:#E7C1A2;color:#7A3E10;}
.status-pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:800;}
.status-pill.malo{background:#FBE1DC;color:var(--malo);}
.status-pill.regular{background:var(--naranja-100);color:var(--regular);}
.status-pill.bueno{background:var(--verde-100);color:var(--bueno);}
.status-pill.excelente{background:var(--azul-100);color:var(--excelente);}
.trend{display:inline-flex;align-items:center;gap:3px;font-weight:700;}
.trend svg{width:12px;height:12px;}
.trend.up{color:var(--verde-800);}
.trend.down{color:var(--malo);}
.trend.flat{color:var(--tinta-60);}

.pager{display:flex;align-items:center;justify-content:space-between;padding:12px 2px 0;flex-wrap:wrap;gap:10px;}
.pager-info{font-size:12px;color:var(--tinta-60);font-weight:600;}
.pager-btns{display:flex;gap:6px;}
.pager-btns button{
  border:1px solid var(--linea);background:var(--blanco);border-radius:9px;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer;color:var(--tinta);
}
.pager-btns button:disabled{opacity:.4;cursor:default;}
.pager-btns button:not(:disabled):hover{background:var(--rojo-100);border-color:var(--rojo-200);}

.empty-state{padding:36px 10px;text-align:center;color:var(--tinta-60);}
.empty-state svg{width:34px;height:34px;color:var(--rojo-300);margin-bottom:8px;}

/* mobile bottom nav */
.bottom-nav{display:none;}
.hamburger{display:none;}

.toast-wrap{position:fixed;bottom:18px;right:18px;display:flex;flex-direction:column;gap:8px;z-index:999;}
.toast{background:var(--tinta);color:#fff;padding:11px 16px;border-radius:12px;font-size:12.5px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.25);display:flex;align-items:center;gap:9px;animation:toastin .25s ease;}
.toast.ok{background:var(--verde-800);}
.toast svg{width:15px;height:15px;flex:none;}
@keyframes toastin{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

@media (max-width:920px){
  .app-shell{grid-template-columns:1fr;}
  .sidebar{position:fixed;left:0;top:0;bottom:0;width:220px;z-index:50;transform:translateX(-100%);transition:transform .2s ease;box-shadow:20px 0 40px rgba(0,0,0,.25);}
  .sidebar.open{transform:translateX(0);}
  .sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40;}
  .sidebar-overlay.show{display:block;}
  .hamburger{display:flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:11px;background:var(--blanco);border:1px solid var(--linea);cursor:pointer;box-shadow:var(--shadow-card);}
  .hamburger svg{width:19px;height:19px;color:var(--rojo-700);}
  .main{padding:16px 14px 100px;}
  .bottom-nav{
    display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--blanco);border-top:1px solid var(--linea);
    z-index:45;overflow-x:auto;padding:6px 4px;gap:2px;box-shadow:0 -6px 18px rgba(0,0,0,.06);
  }
  .bottom-nav button{flex:1 0 auto;min-width:64px;display:flex;flex-direction:column;align-items:center;gap:3px;border:none;background:transparent;padding:6px 4px;border-radius:10px;color:var(--tinta-60);font-size:9.5px;font-weight:700;}
  .bottom-nav button svg{width:18px;height:18px;}
  .bottom-nav button.active{color:var(--rojo-700);}
  .page-header{align-items:flex-start;}
}
@media (min-width:921px){.hamburger{display:none;}}
</style>
</head>

  {id:"detallado",  name:"Reporte Detallado",     icon:"detail",      subtitle:"Registros diarios de cosecha"},
  {id:"fechasKg",   name:"Reporte Fechas KG.",    icon:"calendarKg",  subtitle:"Kilos cosechados por fecha"},
  {id:"fechasCump", name:"Reporte Fechas CUMP. %",icon:"calendarPct", subtitle:"Cumplimiento por fecha"},
  {id:"regUnicos",  name:"Reporte Reg. Únicos",   icon:"uniques",     subtitle:"Registros únicos por cosechador"},
  {id:"placasTdp",  name:"Reporte Placas TDP",    icon:"truck",       subtitle:"Rendimiento por unidad de transporte"},
  {id:"final",      name:"Reporte Final",         icon:"finalReport", subtitle:"Consolidado de campaña"},
];

let state = {
  activePage: "dashboard",
  data: { DETALLE:[], TDP:[], UNICOS:[], REPORTE:[] },
  filters: {},
  sort: {},
  page: {},
  search: {},
  online: navigator.onLine,
  lastSync: null,
};
</script>
<script>
/* ---------- Utils: format ---------- */
function toNum(v){
  if(v===null||v===undefined||v==="") return 0;
  if(typeof v==="number") return v;
  let s=String(v).trim().replace(/%/g,"").replace(/,/g,"");
  let n=parseFloat(s);
  return isNaN(n)?0:n;
}
function fmtInt(v){ return Math.round(toNum(v)).toLocaleString("es-PE"); }
function fmtKg(v){ return Math.round(toNum(v)).toLocaleString("es-PE"); }
function fmtPct(v){
  let n = toNum(v);
  if(n<=1.0001 && n>0) n = n*100; // stored as fraction
  return Math.round(n).toLocaleString("es-PE")+"%";
}
function pctNum(v){
  let n = toNum(v);
  if(n<=1.0001 && n>0) n = n*100;
  return n;
}
function fmtAvg(v){
  let n = toNum(v);
  return n.toLocaleString("es-PE", {maximumFractionDigits:1, minimumFractionDigits:0});
}
/* Parse many date formats -> Date object (local, no time) */
function parseFecha(v){
  if(!v) return null;
  if(v instanceof Date) return isNaN(v)?null:v;
  if(typeof v==="number"){
    // excel serial date
    const epoch = new Date(Date.UTC(1899,11,30));
    return new Date(epoch.getTime()+v*86400000);
  }
  const s = String(v).trim();
  let m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})/);
  if(m){
    let d=+m[1], mo=+m[2], y=+m[3];
    if(y<100) y+=2000;
    return new Date(y, mo-1, d);
  }
  m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m) return new Date(+m[1], +m[2]-1, +m[3]);
  const d2 = new Date(s);
  return isNaN(d2)?null:d2;
}
function fmtFecha(v){
  const d = parseFecha(v);
  if(!d) return "—";
  const dd=String(d.getDate()).padStart(2,"0");
  const mm=String(d.getMonth()+1).padStart(2,"0");
  const yy=d.getFullYear();
  return `${dd}/${mm}/${yy}`;
}
function fmtFechaCorta(v){
  const d = parseFecha(v);
  if(!d) return "—";
  const dd=String(d.getDate()).padStart(2,"0");
  const mm=String(d.getMonth()+1).padStart(2,"0");
  return `${dd}/${mm}`;
}
function cumplimientoNivel(pctValue){
  const n = pctValue;
  if(n<86) return {key:"malo", label:"MALO"};
  if(n<100) return {key:"regular", label:"REGULAR"};
  if(n<105) return {key:"bueno", label:"BUENO"};
  return {key:"excelente", label:"EXCELENTE"};
}
function esc(s){ return String(s===undefined||s===null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function field(row, ...names){
  for(const n of names){ if(row[n]!==undefined) return row[n]; }
  return "";
}

/* ---------- IndexedDB ---------- */
function openDB(){
  return new Promise((resolve,reject)=>{
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = ()=>{
      const db = req.result;
      Object.values(SHEETS).forEach(name=>{
        if(!db.objectStoreNames.contains(name)) db.createObjectStore(name, {autoIncrement:true});
      });
      if(!db.objectStoreNames.contains("meta")) db.createObjectStore("meta");
    };
    req.onsuccess = ()=>resolve(req.result);
    req.onerror = ()=>reject(req.error);
  });
}
async function idbPutAll(storeName, rows){
  const db = await openDB();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction(storeName, "readwrite");
    tx.objectStore(storeName).clear();
    rows.forEach(r=>tx.objectStore(storeName).put(r));
    tx.oncomplete = ()=>resolve();
    tx.onerror = ()=>reject(tx.error);
  });
}
async function idbGetAll(storeName){
  const db = await openDB();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction(storeName, "readonly");
    const req = tx.objectStore(storeName).getAll();
    req.onsuccess = ()=>resolve(req.result||[]);
    req.onerror = ()=>reject(req.error);
  });
}
async function idbSetMeta(key,val){
  const db = await openDB();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction("meta","readwrite");
    tx.objectStore("meta").put(val,key);
    tx.oncomplete=()=>resolve(); tx.onerror=()=>reject(tx.error);
  });
}
async function idbGetMeta(key){
  const db = await openDB();
  return new Promise((resolve)=>{
    const tx = db.transaction("meta","readonly");
    const req = tx.objectStore("meta").get(key);
    req.onsuccess = ()=>resolve(req.result);
    req.onerror = ()=>resolve(undefined);
  });
}

/* ---------- Fetch data (network-first, IndexedDB fallback) ---------- */
async function fetchSheet(sheetKey){
  const sheetName = SHEETS[sheetKey];
  try{
    const res = await fetch(`${GAS_URL}?sheet=${encodeURIComponent(sheetName)}&t=${Date.now()}`, {method:"GET"});
    if(!res.ok) throw new Error("HTTP "+res.status);
    const json = await res.json();
    const rows = json.data || json.rows || (Array.isArray(json)?json:[]);
    await idbPutAll(sheetName, rows);
    return {rows, fromNetwork:true};
  }catch(err){
    const rows = await idbGetAll(sheetName);
    return {rows, fromNetwork:false, error:err};
  }
}

async function loadAllData(showToast){
  let anyNetwork = false, anyRows=false;
  for(const key of Object.keys(SHEETS)){
    const {rows, fromNetwork} = await fetchSheet(key);
    state.data[key] = rows;
    if(fromNetwork) anyNetwork = true;
    if(rows.length) anyRows = true;
  }
  state.online = anyNetwork;
  if(anyNetwork){
    state.lastSync = new Date();
    await idbSetMeta("lastSync", state.lastSync.toISOString());
    if(showToast) toast("Datos sincronizados con Google Sheets", "ok");
  } else {
    const stored = await idbGetMeta("lastSync");
    state.lastSync = stored ? new Date(stored) : null;
    if(showToast) toast(anyRows ? "Sin conexión — usando datos guardados" : "Sin conexión y sin datos guardados aún", "warn");
  }
  updateSyncPill();
}

/* ---------- Toasts ---------- */
function toast(msg, type){
  const wrap = document.getElementById("toastWrap");
  const el = document.createElement("div");
  el.className = "toast"+(type==="ok"?" ok":"");
  el.innerHTML = (type==="ok"?ICONS.check:ICONS.wifiOff)+`<span>${esc(msg)}</span>`;
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.opacity="0"; el.style.transition="opacity .3s"; setTimeout(()=>el.remove(),300); }, 3600);
}
function updateSyncPill(){
  const pill = document.getElementById("syncPill");
  const text = document.getElementById("syncText");
  const last = document.getElementById("lastSync");
  pill.classList.toggle("offline", !state.online);
  text.textContent = state.online ? "Conectado a Sheets" : "Modo sin conexión";
  last.textContent = state.lastSync ? "Últ. sync: "+state.lastSync.toLocaleTimeString("es-PE",{hour:"2-digit",minute:"2-digit"}) : "Sin sincronizar";
}
</script>
<script>
/* =========================================================
   Componentes genéricos de UI
   ========================================================= */

function uniqueVals(rows, keyNames){
  const s = new Set();
  rows.forEach(r=>{ const v = field(r,...keyNames); if(v!==undefined && v!==null && v!=="") s.add(String(v)); });
  return Array.from(s).sort((a,b)=>a.localeCompare(b,"es"));
}

/* Filter bar: defs = [{key,label,icon,fieldNames,type:'select'|'date'}] */
function renderFilterBar(pageId, rows, defs){
  state.filters[pageId] = state.filters[pageId] || {};
  const f = state.filters[pageId];
  let html = `<div class="filter-bar">`;
  defs.forEach(d=>{
    if(d.type==="date"){
      html += `<div class="filter-field"><span>${ICONS[d.icon]||ICONS.calendar}</span><label>${d.label}</label>
        <input type="date" data-fkey="${d.key}" value="${f[d.key]||""}"></div>`;
    } else {
      const opts = uniqueVals(rows, d.fieldNames);
      html += `<div class="filter-field"><span>${ICONS[d.icon]||ICONS.tag}</span><label>${d.label}</label>
        <select data-fkey="${d.key}"><option value="">Todos</option>${opts.map(o=>`<option value="${esc(o)}" ${f[d.key]===o?"selected":""}>${esc(o)}</option>`).join("")}</select></div>`;
    }
  });
  html += `<button class="filter-clear" data-clear="${pageId}">Limpiar filtros</button></div>`;
  return html;
}
function bindFilterBar(container, pageId, onChange){
  container.querySelectorAll("[data-fkey]").forEach(el=>{
    el.addEventListener("change", ()=>{
      state.filters[pageId] = state.filters[pageId]||{};
      state.filters[pageId][el.dataset.fkey] = el.value;
      state.page[pageId] = 1;
      onChange();
    });
  });
  const clearBtn = container.querySelector("[data-clear]");
  if(clearBtn) clearBtn.addEventListener("click", ()=>{
    state.filters[pageId] = {};
    state.page[pageId] = 1;
    onChange();
  });
}
function applyFilters(rows, pageId, defs){
  const f = state.filters[pageId] || {};
  return rows.filter(r=>{
    return defs.every(d=>{
      const val = f[d.key];
      if(!val) return true;
      if(d.type==="date"){
        const rd = parseFecha(field(r,...d.fieldNames));
        if(!rd) return false;
        const iso = rd.getFullYear()+"-"+String(rd.getMonth()+1).padStart(2,"0")+"-"+String(rd.getDate()).padStart(2,"0");
        return iso===val;
      }
      return String(field(r,...d.fieldNames))===val;
    });
  });
}

/* Legend bar for cumplimiento */
function renderLegend(){
  return `<div class="legend-bar">
    <div class="legend-chip"><span class="legend-dot" style="background:var(--malo)"></span>MALO <span class="rango">0–85%</span></div>
    <div class="legend-chip"><span class="legend-dot" style="background:var(--regular)"></span>REGULAR <span class="rango">86–99%</span></div>
    <div class="legend-chip"><span class="legend-dot" style="background:var(--bueno)"></span>BUENO <span class="rango">100–104%</span></div>
    <div class="legend-chip"><span class="legend-dot" style="background:var(--excelente)"></span>EXCELENTE <span class="rango">105%+</span></div>
  </div>`;
}

/* KPI card */
function kpiCard({icon,label,value,sub,accent,tint}){
  return `<div class="kpi-card" style="--accent:${accent||'var(--rojo-700)'};--accent-tint:${tint||'var(--rojo-100)'}">
    <div class="kpi-top"><div class="kpi-icon">${ICONS[icon]||ICONS.tag}</div></div>
    <div class="kpi-label">${esc(label)}</div>
    <div class="kpi-value">${value}</div>
    ${sub?`<div class="kpi-sub">${sub}</div>`:""}
  </div>`;

/* Search box */
function renderSearchBox(pageId, placeholder){
  return `<div class="filter-field search-field"><span>${ICONS.search}</span>
    <input type="text" data-search="${pageId}" placeholder="${esc(placeholder)}" value="${esc(state.search[pageId]||"")}"></div>`;
}
function bindSearchBox(container, pageId, onChange){
  const el = container.querySelector(`[data-search="${pageId}"]`);
  if(!el) return;
  let t;
  el.addEventListener("input", ()=>{
    clearTimeout(t);
    t = setTimeout(()=>{
      state.search[pageId] = el.value;
      state.page[pageId] = 1;
      onChange();
    }, 220);
  });
}

/* Rank badge for top-N tables */
function rankBadge(i){
  const cls = i===0?"r1":i===1?"r2":i===2?"r3":"";
  return `<span class="rank-badge ${cls}">${i+1}</span>`;
}

/* Trend icon comparing two numeric values */
function trendIcon(curr, prev){
  if(prev===undefined || prev===null) return `<span class="trend flat">${ICONS.flat}</span>`;
  if(curr>prev) return `<span class="trend up">${ICONS.up}</span>`;
  if(curr<prev) return `<span class="trend down">${ICONS.down}</span>`;
  return `<span class="trend flat">${ICONS.flat}</span>`;
}

/* ---------- Donut chart with center label + side legend ---------- */
const chartInstances = {};
function renderDonut(canvasId, containerCenterId, legendId, groupCounts, totalLabel){
  const palette = ["#B34432","#5C9143","#2E6E9E","#C9821F","#7A2E22","#8CBF6E","#D9553D","#3A6B2E"];
  const labels = Object.keys(groupCounts);
  const values = Object.values(groupCounts);
  const total = values.reduce((a,b)=>a+b,0) || 1;
  const canvas = document.getElementById(canvasId);
  if(chartInstances[canvasId]) chartInstances[canvasId].destroy();
  chartInstances[canvasId] = new Chart(canvas, {
    type:"doughnut",
    data:{ labels, datasets:[{ data:values, backgroundColor: labels.map((_,i)=>palette[i%palette.length]), borderWidth:3, borderColor:"#fff", hoverOffset:4 }]},
    options:{ cutout:"72%", plugins:{legend:{display:false}, tooltip:{callbacks:{label:(ctx)=>{
      const v = ctx.parsed; const p = ((v/total)*100).toFixed(0);
      return ` ${ctx.label}: ${v.toLocaleString("es-PE")} (${p}%)`;
    }}}}, maintainAspectRatio:false }
  });
  document.getElementById(containerCenterId).innerHTML = `<b>${total.toLocaleString("es-PE")}</b><span>${totalLabel}</span>`;
  document.getElementById(legendId).innerHTML = labels.map((l,i)=>{
    const v = values[i]; const p = ((v/total)*100).toFixed(0);
    return `<div class="donut-legend-item"><span class="sw" style="background:${palette[i%palette.length]}"></span><span class="nm">${esc(l||"—")}</span><span class="vl">${v.toLocaleString("es-PE")} · ${p}%</span></div>`;
  }).join("") || `<div class="donut-legend-item"><span class="nm">Sin datos</span></div>`;
}

/* ---------- Generic sortable / paginated table ---------- */
/**
 * cols: [{key,label,align:'right'|'left', render:(row)=>html, sortVal:(row)=>number|string, icon}]
 */
function renderTable({pageId, tableId, cols, rows, pageSize, sortDefaultKey, sortDefaultDir}){
  state.sort[tableId] = state.sort[tableId] || {key:sortDefaultKey, dir:sortDefaultDir||"desc"};
  state.page[tableId] = state.page[tableId] || 1;
  const sort = state.sort[tableId];
  let sorted = rows.slice();
  if(sort.key){
    const col = cols.find(c=>c.key===sort.key);
    sorted.sort((a,b)=>{
      let va = col.sortVal?col.sortVal(a):a[sort.key];
      let vb = col.sortVal?col.sortVal(b):b[sort.key];
      if(typeof va==="string") va=va.toLowerCase();
      if(typeof vb==="string") vb=vb.toLowerCase();
      if(va<vb) return sort.dir==="asc"?-1:1;
      if(va>vb) return sort.dir==="asc"?1:-1;
      return 0;
    });
  }
  const size = pageSize||50;
  const totalPages = Math.max(1, Math.ceil(sorted.length/size));
  if(state.page[tableId]>totalPages) state.page[tableId]=totalPages;
  const p = state.page[tableId];
  const pageRows = pageSize ? sorted.slice((p-1)*size, p*size) : sorted;

  let html = `<div class="table-scroll"><table class="data-table" id="${tableId}"><thead><tr>`;
  cols.forEach(c=>{
    const sortable = c.sortable!==false;
    html += `<th class="${sortable?'sortable':''}" ${sortable?`data-sortkey="${c.key}"`:""}><div class="th-flex">${c.icon?ICONS[c.icon]||"":""}<span>${esc(c.label)}</span>${sortable?(sort.key===c.key?(sort.dir==="asc"?ICONS.up:ICONS.down):ICONS.sort):""}</div></th>`;
  });
  html += `</tr></thead><tbody>`;
  if(pageRows.length===0){
    html += `<tr><td colspan="${cols.length}"><div class="empty-state">${ICONS.empty}<div>No hay registros con los filtros aplicados</div></div></td></tr>`;
  } else {
    pageRows.forEach((r,idx)=>{
      html += `<tr>`;
      cols.forEach(c=>{
        html += `<td class="${c.align==='right'?'num':''}">${c.render(r, idx, (p-1)*size+idx)}</td>`;
      });
      html += `</tr>`;
    });
  }
  html += `</tbody></table></div>`;
  if(pageSize){
    html += `<div class="pager"><div class="pager-info">Mostrando ${pageRows.length?( (p-1)*size+1 ):0}–${(p-1)*size+pageRows.length} de ${sorted.length} registros</div>
      <div class="pager-btns">
        <button data-pg="first" ${p<=1?"disabled":""}>«</button>
        <button data-pg="prev" ${p<=1?"disabled":""}>‹ Anterior</button>
        <button data-pg="next" ${p>=totalPages?"disabled":""}>Siguiente ›</button>
        <button data-pg="last" ${p>=totalPages?"disabled":""}>»</button>
      </div></div>`;
  }
  return html;
}
function bindTable(container, tableId, onChange){
  const table = container.querySelector(`#${tableId}`);
  if(table){
    table.querySelectorAll("th.sortable").forEach(th=>{
      th.addEventListener("click", ()=>{
        const key = th.dataset.sortkey;
        const s = state.sort[tableId];
        if(s.key===key) s.dir = s.dir==="asc"?"desc":"asc";
        else { s.key=key; s.dir="desc"; }
        onChange();
      });
    });
  }
  const pagerBtns = container.querySelectorAll(`[data-pg]`);
  pagerBtns.forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const s = state.page[tableId]||1;
      const totalPages = btn.dataset.totalPages;
      if(btn.dataset.pg==="prev") state.page[tableId]=Math.max(1,s-1);
      if(btn.dataset.pg==="next") state.page[tableId]=s+1;
      if(btn.dataset.pg==="first") state.page[tableId]=1;
      if(btn.dataset.pg==="last") state.page[tableId]=99999;
      onChange();
    });
  });
}

/* ---------- Pivot builder: rows grouped by group fields, columns = unique dates ---------- */
function buildDatePivot(rows, groupFieldsNames, dateFieldNames, valueFieldNames, agg){
  // agg: 'sum' | 'avg'
  const dateKeySet = new Set();
  const groups = new Map(); // groupKey -> {label parts, dateMap: Map(dateKey -> [values])}
  rows.forEach(r=>{
    const d = parseFecha(field(r,...dateFieldNames));
    if(!d) return;
    const dateKey = d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
    dateKeySet.add(dateKey);
    const gKey = groupFieldsNames.map(fns=>field(r,...fns)).join("§");
    if(!groups.has(gKey)) groups.set(gKey, {raw:r, dateMap:new Map()});
    const g = groups.get(gKey);
    if(!g.dateMap.has(dateKey)) g.dateMap.set(dateKey, []);
    g.dateMap.get(dateKey).push(toNum(field(r,...valueFieldNames)));
  });
  const dateKeys = Array.from(dateKeySet).sort();
  const groupRows = Array.from(groups.values()).map(g=>{
    const vals = {};
    dateKeys.forEach(dk=>{
      const arr = g.dateMap.get(dk);
      if(!arr) { vals[dk] = null; return; }
      vals[dk] = agg==="avg" ? (arr.reduce((a,b)=>a+b,0)/arr.length) : arr.reduce((a,b)=>a+b,0);
    });
    return {raw:g.raw, vals};
  });
  return {dateKeys, groupRows};
}
</script>
<script>
/* =========================================================
   Helpers de agregación
   ========================================================= */
function uniqCount(rows, fieldNames){
  const s = new Set();
  rows.forEach(r=>{ const v = field(r,...fieldNames); if(v!==undefined&&v!==null&&v!=="") s.add(String(v)); });
  return s.size;
}
function sumField(rows, fieldNames){
  return rows.reduce((a,r)=>a+toNum(field(r,...fieldNames)),0);
}
function avgPct(rows, fieldNames){
  if(!rows.length) return 0;
  const vals = rows.map(r=>pctNum(field(r,...fieldNames)));
  return vals.reduce((a,b)=>a+b,0)/vals.length;
}
function groupBy(rows, keyFieldNames){
  const map = new Map();
  rows.forEach(r=>{
    const k = field(r,...keyFieldNames);
    const ks = k===undefined||k===null||k===""?"—":String(k);
    if(!map.has(ks)) map.set(ks, []);
    map.get(ks).push(r);
  });
  return map;
}

/* Build a card wrapper */
function cardWrap(title, icon, innerHtml, extraHeadHtml){
  return `<div class="card"><div class="card-head"><h3>${esc(title)}</h3><div style="display:flex;align-items:center;gap:8px;">${extraHeadHtml||""}<div class="card-icn">${ICONS[icon]||ICONS.tag}</div></div></div>${innerHtml}</div>`;
}

/* Render a pivot table with dates as columns */
function renderPivotTable({tableId, groupFieldsCfg, dateFieldNames, valueFieldNames, agg, valueFmt, rows, extraTotalRow}){
  const {dateKeys, groupRows} = buildDatePivot(rows, groupFieldsCfg.map(g=>g.fieldNames), dateFieldNames, valueFieldNames, agg||"sum");
  let html = `<div class="table-scroll"><table class="data-table" id="${tableId}"><thead><tr>`;
  groupFieldsCfg.forEach(g=> html += `<th>${g.icon?ICONS[g.icon]:""} ${esc(g.label)}</th>`);
  dateKeys.forEach(dk=>{
    const d = new Date(dk);
    html += `<th>${fmtFechaCorta(d)}</th>`;
  });
  html += `<th>TOTAL PROM.</th></tr></thead><tbody>`;
  if(groupRows.length===0){
    html += `<tr><td colspan="${groupFieldsCfg.length+dateKeys.length+1}"><div class="empty-state">${ICONS.empty}<div>No hay registros con los filtros aplicados</div></div></td></tr>`;
  } else {
    // Total row
    html += `<tr style="background:var(--rojo-100);font-weight:800;">`;
    groupFieldsCfg.forEach((g,i)=> html += `<td>${i===0?"TOTAL":""}</td>`);
    let prevTotal;
    dateKeys.forEach(dk=>{
      const colVals = groupRows.map(g=>g.vals[dk]).filter(v=>v!==null&&v!==undefined);
      const tot = colVals.length ? colVals.reduce((a,b)=>a+b,0) : null;
      html += `<td class="num">${tot!==null?valueFmt(tot):"—"} ${tot!==null?trendIcon(tot, prevTotal):""}</td>`;
      if(tot!==null) prevTotal = tot;
    });
    const allVals = groupRows.flatMap(g=>dateKeys.map(dk=>g.vals[dk]).filter(v=>v!==null));
    const grandAvg = allVals.length ? allVals.reduce((a,b)=>a+b,0)/allVals.length : 0;
    html += `<td class="num">${valueFmt(grandAvg)}</td></tr>`;
    groupRows.forEach(g=>{
      html += `<tr>`;
      groupFieldsCfg.forEach(gc=> html += `<td>${esc(field(g.raw,...gc.fieldNames))||"—"}</td>`);
      let prev;
      const rowVals=[];
      dateKeys.forEach(dk=>{
        const v = g.vals[dk];
        html += `<td class="num">${v!==null&&v!==undefined?valueFmt(v):"—"} ${v!==null&&v!==undefined?trendIcon(v,prev):""}</td>`;
        if(v!==null&&v!==undefined){ prev=v; rowVals.push(v); }
      });
      const rowAvg = rowVals.length ? rowVals.reduce((a,b)=>a+b,0)/rowVals.length : 0;
      html += `<td class="num">${valueFmt(rowAvg)}</td></tr>`;
    });
  }
  html += `</tbody></table></div>`;
  return html;
}

    <div class="chart-row" style="grid-template-columns:1fr 1fr;">

      ${cardWrap("KG y cumplimiento por Modalidad / Categ. 2026", "tag", `<div id="tblB2_Wrap"></div>`)}
    </div>
  `;
  bindFilterBar(root, pid, ()=>pageFinal());

  const runA = ()=>{
    document.getElementById("tblA_Wrap").innerHTML = renderTable({pageId:pid, tableId:"tblA", pageSize:50, sortDefaultKey:"dias", sortDefaultDir:"desc",
      rows:tA, cols:[
        {key:"dni", label:"DNI", render:r=>esc(r.dni)},
        {key:"nombre", label:"Apellidos y nombres", render:r=>esc(r.nombre)},
        {key:"modalidad", label:"Modalidad", render:r=>esc(r.modalidad)},
        {key:"historico", label:"Histórico", render:r=>esc(r.historico)},
        {key:"cump", label:"Cump. %", align:"right", render:r=>`<span class="status-pill ${cumplimientoNivel(r.cump).key}">${Math.round(r.cump)}%</span>`, sortVal:r=>r.cump},
        {key:"dias", label:"Total días", align:"right", render:r=>fmtInt(r.dias), sortVal:r=>r.dias},
        {key:"categ", label:"Categ. 2026", render:r=>esc(r.categ)},
      ]});
    bindTable(document.getElementById("tblA_Wrap"), "tblA", runA);
  }; runA();

  const runB1 = ()=>{
    document.getElementById("tblB1_Wrap").innerHTML = renderTable({pageId:pid, tableId:"tblB1", pageSize:0, sortDefaultKey:"modalidad", sortDefaultDir:"asc",
      rows:tB1, cols:[
        {key:"modalidad", label:"Modalidad", icon:"mode", render:r=>esc(r.modalidad)},
        {key:"historico", label:"Histórico", render:r=>esc(r.historico)},
        {key:"kg", label:"Total KG", align:"right", render:r=>fmtKg(r.kg), sortVal:r=>r.kg},
        {key:"cump", label:"Cump. %", align:"right", render:r=>`<span class="status-pill ${cumplimientoNivel(r.cump).key}">${Math.round(r.cump)}%</span>`, sortVal:r=>r.cump},
      ]});
    bindTable(document.getElementById("tblB1_Wrap"), "tblB1", runB1);
  }; runB1();

  const runB2 = ()=>{
    document.getElementById("tblB2_Wrap").innerHTML = renderTable({pageId:pid, tableId:"tblB2", pageSize:0, sortDefaultKey:"modalidad", sortDefaultDir:"asc",
      rows:tB2, cols:[
        {key:"modalidad", label:"Modalidad", icon:"mode", render:r=>esc(r.modalidad)},
        {key:"categ", label:"Categ. 2026", render:r=>esc(r.categ)},
        {key:"kg", label:"Total KG", align:"right", render:r=>fmtKg(r.kg), sortVal:r=>r.kg},
        {key:"cump", label:"Cump. %", align:"right", render:r=>`<span class="status-pill ${cumplimientoNivel(r.cump).key}">${Math.round(r.cump)}%</span>`, sortVal:r=>r.cump},
      ]});
    bindTable(document.getElementById("tblB2_Wrap"), "tblB2", runB2);
  }; runB2();
}

const PAGE_RENDERERS = {
  dashboard: pageDashboard, detallado: pageDetallado, fechasKg: pageFechasKg,
  fechasCump: pageFechasCump, regUnicos: pageRegUnicos, placasTdp: pagePlacasTdp, final: pageFinal,
};
</script>
<script>
/* =========================================================
   Navegación, router, reloj, arranque
   ========================================================= */
function buildNav(){
  const navList = document.getElementById("navList");
  const bottomNav = document.getElementById("bottomNav");
  navList.innerHTML = PAGES.map(p=>`<button class="nav-item ${p.id===state.activePage?'active':''}" data-nav="${p.id}">${ICONS[p.icon]}<span>${esc(p.name)}</span></button>`).join("");
  bottomNav.innerHTML = PAGES.map(p=>`<button class="${p.id===state.activePage?'active':''}" data-nav="${p.id}">${ICONS[p.icon]}<span>${esc(p.name.split(" ")[0])}</span></button>`).join("");
  document.querySelectorAll("[data-nav]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      state.activePage = btn.dataset.nav;
      closeSidebar();
      renderApp();
    });
  });
}
function openSidebar(){ document.getElementById("sidebar").classList.add("open"); document.getElementById("overlay").classList.add("show"); }
function closeSidebar(){ document.getElementById("sidebar").classList.remove("open"); document.getElementById("overlay").classList.remove("show"); }

function renderApp(){
  const p = PAGES.find(pg=>pg.id===state.activePage) || PAGES[0];
  document.getElementById("pageIconBadge").innerHTML = ICONS[p.icon];
  document.getElementById("pageTitle").textContent = p.name;
  document.getElementById("pageSubtitle").textContent = p.subtitle;
  buildNav();
  (PAGE_RENDERERS[p.id] || pageDashboard)();
}

function tickClock(){
  const now = new Date();
  const dateStr = now.toLocaleDateString("es-PE", {weekday:"long", day:"2-digit", month:"long", year:"numeric"});
  const timeStr = now.toLocaleTimeString("es-PE", {hour:"2-digit", minute:"2-digit", second:"2-digit"});
  document.getElementById("clockDate").textContent = dateStr;
  document.getElementById("clockTime").textContent = timeStr;
}

async function init(){
  document.getElementById("hamburger").addEventListener("click", openSidebar);
  document.getElementById("overlay").addEventListener("click", closeSidebar);
  tickClock();
  setInterval(tickClock, 1000);

  window.addEventListener("online", ()=>{ toast("Conexión restablecida — sincronizando…"); loadAllData(true).then(renderApp); });
  window.addEventListener("offline", ()=>{ state.online=false; updateSyncPill(); toast("Sin conexión a internet — modo offline"); });

  buildNav();
  renderApp();
  await loadAllData(true);
  renderApp();

  if("serviceWorker" in navigator){
    try{ await navigator.serviceWorker.register("service-worker.js"); }catch(e){ console.warn("SW registration failed", e); }
  }
}
init();
</script>
</body>
</html>

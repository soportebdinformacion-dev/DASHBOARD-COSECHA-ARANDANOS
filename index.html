<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tarjeta KPI</title>
  <style>
    /* Estilos generales del contenedor del visual */
    .kpi-card {
      width: 100%;
      max-width: 520px; /* Ancho horizontal similar a la imagen */
      height: 110px;    /* Altura compacta */
      background-color: #1e8e45; /* Verde de fondo */
      border-radius: 20px;
      padding: 0 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.15);
      box-sizing: border-box;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      color: #ffffff;
    }

    /* Sección izquierda: Texto y métricas */
    .kpi-content {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 4px;
    }

    .kpi-title {
      font-size: 14px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      opacity: 0.95;
    }

    .kpi-value-container {
      display: flex;
      align-items: baseline;
      gap: 6px;
    }

    .kpi-value {
      font-size: 34px;
      font-weight: 800;
      line-height: 1;
    }

    .kpi-unit {
      font-size: 20px;
      font-weight: 600;
      opacity: 0.9;
    }

    /* Sección derecha: Círculo e Ícono dinámico dinámico en SVG (máxima nitidez) */
    .kpi-icon-wrapper {
      width: 64px;
      height: 64px;
      background-color: rgba(255, 255, 255, 0.15); /* Círculo de fondo translúcido */
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .kpi-icon-wrapper svg {
      width: 32px;
      height: 32px;
    }
  </style>
</head>
<body>

  <!-- Componente Redimensionado: TOTAL CUMP. % POR MODALIDAD / TOTAL KG -->
  <div class="kpi-card">
    <div class="kpi-content">
      <span class="kpi-title">TOTAL CUMP. % POR MODALIDAD</span>
      <div class="kpi-value-container">
        <span class="kpi-value">123,265.31</span>
        <span class="kpi-unit">kg</span>
      </div>
    </div>
    
    <div class="kpi-icon-wrapper">
      <!-- Ejemplo SVG escalable sin pérdida de nitidez -->
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="9" cy="15" r="4" fill="#a855f7" />
        <circle cx="15" cy="15" r="4" fill="#9333ea" />
        <circle cx="12" cy="9" r="4" fill="#c084fc" />
      </svg>
    </div>
  </div>

</body>
</html>
